name: keep-alive

# Qdrant's free tier suspends a cluster after a week without requests; one small query a day prevents it.
# A failed run means the cluster is unreachable, and GitHub emails the repo owner.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  qdrant:
    runs-on: ubuntu-latest
    steps:
      - name: Count documents in Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          curl -sf -X POST "$QDRANT_URL/collections/documents/points/count" \
            -H "api-key: $QDRANT_API_KEY" -H "Content-Type: application/json" -d '{"exact": false}'
